[project]
name = "fairbill"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.22,<1",
    "pymupdf>=1.25,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
