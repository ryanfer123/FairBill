services:
  - type: web
    name: fairbill-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /v1/health
    autoDeployTrigger: off
    envVars:
      - key: FAIRBILL_PROFILE
        value: hosted
      - key: FAIRBILL_SUPABASE_URL
        value: https://ehqolzlwsjvnwiervyid.supabase.co
      - key: FAIRBILL_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FAIRBILL_SUPABASE_SERVICE_KEY
        sync: false
      - key: FAIRBILL_PRIVACY_CONTACT
        sync: false
