.symbol{font-family:FairBillSymbols;font-weight:400;display:inline-block;line-height:1}
:root{font-family:Arial,sans-serif;color:#192a25;background:#e5e9e2;font-synthesis:none;--desk:#192a25;--desk-soft:#4b5d54;--desk-rule:#bdc9bf}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus,#165c9e);outline-offset:2px}
button:active:not(:disabled){opacity:.82}
.studio{min-height:100dvh;display:grid;grid-template-columns:minmax(220px,270px) minmax(425px,1fr) minmax(230px,310px);max-width:1472px;margin:auto}
.index,.notes{padding:32px 24px}
.index{border-right:1px solid var(--desk-rule)}
.notes{border-left:1px solid var(--desk-rule);align-content:center}
@media(min-width:1051px) and (min-height:720px){.studio{height:100dvh}.index,.notes{overflow:auto}}
.index h1{font-size:31px;margin:7px 0 20px;letter-spacing:-.055em}
.studio-label,.sequence,.section-label{font-family:ui-monospace,monospace;text-transform:uppercase;font-size:11px;letter-spacing:.095em;font-weight:700}
.studio-label,.sequence{color:var(--desk-soft)}
.index h2{font-size:11px;text-transform:uppercase;letter-spacing:.10em;margin:15px 0 6px;color:var(--desk-soft)}
.jump{display:block;text-align:left;width:100%;border:0;background:transparent;color:var(--desk);min-height:36px;border-radius:7px;padding:6px 9px;font-size:13px}
.jump:hover{background:#d8e3d9}
.jump[aria-current=page]{background:#193f34;color:#f6fcf7}
.stage{padding:24px 18px;display:grid;justify-items:center;align-content:start;gap:12px;min-width:0}
.stage-tools{width:min(100%,404px);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--desk-soft)}
.stage-tools button{border:1px solid #74877b;border-radius:20px;min-height:34px;padding:0 13px;background:transparent;color:var(--desk);font-weight:700}
.notes h2{font-size:28px;letter-spacing:-.04em;margin:12px 0}
.notes p,.notes li{font-size:14px;line-height:1.55;color:var(--desk-soft)}
.notes ul{padding-left:17px}
.notes li+li{margin-top:10px}
.notes hr{border:0;border-top:1px solid var(--desk-rule);margin:18px 0}
.link-out{color:#174639;text-underline-offset:3px;font-size:13px;font-weight:bold}
.phone{--canvas:#f6f6ef;--paper:#fffef8;--surface:#ebeee5;--ink:#1b2923;--muted:#4a5d51;--line:#c5cdc3;--strong-line:#75887b;--primary:#164c3d;--on-primary:#fffdf5;--tonal:#d9ecde;--on-tonal:#244839;--hero:#153c32;--hero-ink:#f3f8e9;--hero-muted:#c6dcca;--amber:#7b401b;--amber-bg:#fae7d6;--error:#812d2b;--error-bg:#fce6e0;--focus:#145ead;--rule:rgba(207,231,213,.23);color:var(--ink);background:var(--canvas);width:min(100%,404px);height:min(822px,calc(100dvh - 94px));min-height:630px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid #85928a;border-radius:28px;overflow:hidden;box-shadow:0 15px 34px #233d2526;position:relative}
.phone.dark{color-scheme:dark;--canvas:#15201b;--paper:#1d2b23;--surface:#28392f;--ink:#edf4e8;--muted:#bccdbf;--line:#4a6253;--strong-line:#8da697;--primary:#b5dfc5;--on-primary:#163428;--tonal:#294b3d;--on-tonal:#d1eddb;--hero:#244e40;--hero-ink:#f1fae9;--hero-muted:#d0e5d5;--amber:#ffd5b5;--amber-bg:#593b29;--error:#ffd0c8;--error-bg:#562d29;--focus:#a4ccff}
.appbar{padding:8px 16px;min-height:62px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.appbar .name{font-size:20px;font-weight:750;letter-spacing:-.045em;margin-right:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:20px;font-weight:bold;flex:none}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);font-size:20px;flex:none;display:grid;place-items:center}
.avatar{font-size:13px;font-weight:700}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:21px 18px 20px;outline-offset:-3px}
.scroll>*+*{margin-top:15px}
.scroll h1,.scroll h2,.scroll h3,.scroll p{margin:0}
.scroll h1{font-size:34px;line-height:1.02;letter-spacing:-.055em;overflow-wrap:anywhere}
.scroll h2{font-size:20px;line-height:1.18;letter-spacing:-.03em}
.scroll h3{font-size:15px;line-height:1.25}
.scroll p,.hint{line-height:1.44;color:var(--muted);font-size:14px}
.heading{display:grid;gap:10px}
.section-label{color:var(--muted)}
.hero{position:relative;isolation:isolate;border-radius:23px;padding:22px 18px;background:var(--hero);color:var(--hero-ink);display:grid;gap:12px;overflow:hidden}
.hero .section-label,.hero p{color:var(--hero-muted)}
.hero p{max-width:28ch}
.hero:after{content:'';width:115px;position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(0deg,transparent 0 19px,var(--rule) 19px 20px);mask-image:linear-gradient(90deg,transparent 4%,#000 94%);pointer-events:none;z-index:-1}
.amount{font-variant-numeric:tabular-nums;font-weight:750}
.hero .amount{font-size:clamp(32px,11vw,48px);letter-spacing:-.07em;line-height:1}
.hero .amount+small{font-size:13px;color:var(--hero-muted)}
.hero .btn{background:var(--hero-ink);color:var(--hero);justify-self:start}
.group,.card,.notice{border-radius:16px}
.card,.group{border:1px solid var(--line);background:var(--paper)}
.card{padding:15px;display:grid;gap:10px}
.panel{padding:4px 0;display:grid;gap:10px}
.notice{background:var(--surface);padding:12px 14px;border-left:3px solid var(--strong-line);display:grid;gap:4px}
.notice.warn{background:var(--amber-bg);border-color:var(--amber)}
.notice.bad{background:var(--error-bg);border-color:var(--error)}
.notice b{font-size:13px}
.notice.warn p,.notice.warn b{color:var(--amber)}
.notice.bad p,.notice.bad b{color:var(--error)}
.row{width:100%;color:var(--ink);border:0;background:transparent;min-height:64px;padding:11px 13px;display:flex;gap:12px;align-items:center;text-align:left;border-radius:14px}
.row+.row{border-top:1px solid var(--line);border-radius:0}
button.row:hover{background:var(--surface)}
.row-label{display:grid;gap:4px;flex:1;min-width:0;overflow-wrap:anywhere}
.row small,.footnote{font-size:12px;line-height:1.35;color:var(--muted)}
.row b{font-size:14px}
.key{width:34px;height:34px;display:grid;place-items:center;background:var(--tonal);color:var(--on-tonal);border-radius:10px;flex:none;font-size:17px;font-weight:700}
.chev{color:var(--primary);font-size:22px;flex:none}
.btn{border:1px solid transparent;border-radius:24px;padding:10px 16px;min-height:47px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px;text-align:center}
.btn.secondary{color:var(--primary);background:var(--tonal)}
.btn.outline{color:var(--primary);background:transparent;border-color:var(--strong-line)}
.btn.danger{background:var(--error);color:var(--canvas)}
.btn:disabled{opacity:.48}
.button-stack,.fields{display:grid;gap:9px}
.footer{padding:10px 16px 12px;background:var(--canvas);border-top:1px solid var(--line);display:grid;gap:8px}
.bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:7px 7px 10px}
.bottom button,.rail button{border:0;color:var(--muted);background:transparent;padding:5px 2px;min-height:46px;font-size:12px;font-weight:700}
.bottom button{display:grid;justify-items:center;gap:3px}
.bottom .nav-icon{width:min(46px,100%);border-radius:16px;font-size:17px}
.bottom button[aria-current=page]{color:var(--primary)}
.bottom button[aria-current=page] .nav-icon{background:var(--tonal)}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border-bottom:1px solid var(--line)}
.rail button[aria-current=page]{color:var(--primary);box-shadow:inset 0 -3px var(--primary)}
.tag{width:fit-content;background:var(--tonal);color:var(--on-tonal);font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;line-height:1.18}
.tag.warn{background:var(--amber-bg);color:var(--amber)}
.receipt{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.receipt .row{min-height:55px}
.receipt .row:last-child{border-top:1px dashed var(--strong-line)}
.receipt .amount{font-size:14px;white-space:nowrap}
.receipt .row-label b{font-size:13px}
.excerpt{margin:0;padding:12px;background:var(--surface);border-radius:9px;color:var(--ink);font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.fields label{font-weight:700;font-size:13px;display:grid;gap:6px}
.fields input,.fields select,.fields textarea{min-width:0;width:100%;min-height:46px;background:var(--paper);color:var(--ink);border:1px solid var(--strong-line);border-radius:9px;padding:10px}
.fields textarea{resize:vertical;min-height:123px;line-height:1.4}
.fields .check{display:flex;align-items:center;min-height:44px;gap:9px}
.fields input[type=checkbox]{width:20px;min-height:20px;margin:0}
.paper-text{padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;display:grid;gap:10px}
.paper-text p{color:var(--ink)}
.steps{list-style:none;padding:0;margin-bottom:0;display:grid;gap:2px}
.steps li{padding:10px 0;display:flex;gap:12px;align-items:center;font-size:14px}
.steps li+li{border-top:1px solid var(--line)}
.steps .key{width:28px;height:28px;font-size:13px}
.option-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.waitline{height:4px;border-radius:9px;background:var(--tonal)}
.waitline::before{content:'';display:block;width:48%;height:100%;border-radius:9px;background:var(--primary)}
#announcer{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:1050px){.studio{grid-template-columns:225px minmax(380px,1fr)}.notes{grid-column:1/-1;border-left:0;border-top:1px solid var(--desk-rule);padding-top:17px}}
@media(max-width:680px){.studio{display:block}.index{padding:12px 14px;border-right:0;border-bottom:1px solid var(--desk-rule)}.index h1,.index>.studio-label,.index nav{display:none}.index label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:13px;font-weight:bold}.index select{max-width:100%;min-height:38px;color:var(--desk);background:#f8faf3;border:1px solid #74877b;border-radius:8px;padding:4px}.stage{padding:8px 0 0;gap:7px}.stage-tools{width:100%;padding:0 14px}.phone{width:100%;height:max(510px,calc(100dvh - 113px));min-height:0;border-radius:0;border-left:0;border-right:0;box-shadow:none}.notes{padding:18px}.scroll h1{font-size:clamp(26px,8vw,34px)}}
@media(min-width:681px){.index label{display:none}}
@media(prefers-reduced-motion:no-preference){.btn,.row,.iconbtn{transition:opacity 110ms ease,background-color 110ms ease}}
</style>
</head>
<body>
<div class="studio">
  <aside class="index">
    <div class="studio-label">Mobile design prototype</div>
    <h1>FairBill</h1>
    <nav id="index" aria-label="Prototype screens"></nav>
    <label>Prototype screen <select id="screen-select"></select></label>
  </aside>
  <section class="stage" aria-label="App preview">
    <div class="stage-tools"><span>Interactive sample · No data sent</span><button type="button" id="theme" aria-pressed="false">Dark mode</button></div>
    <div class="phone" id="phone"></div>
    <div id="announcer" role="status"></div>
  </section>
  <aside class="notes" id="notes" aria-label="Design notes"></aside>
</div>
<script>
'use strict';

const groups = [
  ['Start', ['home','capture','paste','reading','cases']],
  ['Review', ['confirm','edit','queue','results','source','documents','timeline','revision']],
  ['Get help', ['aid','aidResult','actions','letter','call','packet']],
  ['Access', ['login','code','account','delete','connection']],
];

const names = {
  home:'Check a bill', capture:'Import a document', paste:'Paste bill text', reading:'Reading and recovery', cases:'Your cases',
  confirm:'Confirm extracted lines', edit:'Correct a line', queue:'Review checklist', results:'Bill findings', source:'Source evidence',
  documents:'Case documents', timeline:'Case timeline', revision:'Previous revision', aid:'Financial assistance', aidResult:'Policy findings',
  actions:'Case actions', letter:'Clarification letter', call:'Three-way call', packet:'Redacted packet', login:'Email sign-in',
  code:'Verification code', account:'Account settings', delete:'Delete account', connection:'Connection settings',
};

const guide = {
  home:['A clear place to start','One primary action starts the review. The recent case and sample remain one tap away.', 'The opening screen keeps the same visual identity as the findings, with a clear action in place of the amount.'],
  capture:['Choose the right evidence','The document type sits above camera, photo and file choices. The device handles the actual picker.', 'End the chooser when a document is selected.'],
  paste:['Give text room','A labelled, multiline field preserves punctuation and line breaks. The sample fills the field so the path is testable.'],
  reading:['Wait with context','Keep the selected document in view. On failure, retain it and offer retry or another method.','The studio exposes both states.'],
  cases:['Find work in progress','Each row shows what is left to do. Use the case title and state as the accessible name and description.'],
  confirm:['Verify at the line','Keep the amount, units, edit action and source location together. Expand the extracted line inside its row.'],
  edit:['Make one correction','Preserve the source position while the user edits parsed values. Save the row before confirming the document.'],
  queue:['Show the next step','A three-step checklist makes unfinished work visible. An updated document requires the checks to run again.'],
  results:['Put the amount in context','The conditional amount leads. The invoice, possible adjustment and insurer deduction each open independently.', 'Adding the second lab order updates the example from ₹1,55,400 to ₹1,56,300.'],
  source:['Prove the number','Show which pages support or contradict a finding. Include the document name, page, line and exact extracted text.'],
  documents:['Use document names','List the kind and review state. Bringing another record into the case returns to confirmation.'],
  timeline:['Make changes traceable','Put the newest revision first. Separate revisions from activity so users can find an earlier decision.'],
  revision:['Preserve the earlier answer','An earlier revision has its own amount and explanation. Its state stays visible while users compare it with current findings.'],
  aid:['Explain the inputs','Income and household size sit together. The prototype identifies the policy as fictional before screening.'],
  aidResult:['Make the policy inspectable','Show the policy clause directly on the result. Keep its applicability qualification beside the finding.'],
  actions:['Separate three decisions','A letter request, a call plan and a shareable packet each have their own status and destination.'],
  letter:['Approve exactly what is written','Editing and approving are distinct states. Editing after approval clears approval on the prototype.'],
  call:['The patient verifies identity','The patient stays on the line. The advocate continues only after patient verification, or ends the call if verification fails.'],
  packet:['Preview before sharing','Show what redaction removes and what is retained. Preview the packet before offering the native share action.'],
  login:['One sign-in task at a time','Ask for an email, then navigate to a dedicated verification screen. The design uses a fictional address.'],
  code:['Make retries recoverable','Use one code field so paste, autofill and screen readers work with the same control.'],
  account:['Put account actions together','Keep sign-out separate from removal. The delete flow has a dedicated review step.'],
  delete:['Make deletion deliberate','Explain the consequence before asking for the confirmation word. The prototype changes only local preview state.'],
  connection:['Give failed connections a route back','Retain the entered address after a failed connection. Return to the bill after a successful test.'],
};

const sampleLine = 'CHARGE | L44 | Complete blood count | CBC | 2026-11-10 | 1 | 900 | 900';
const letterText = 'Dear billing team,\n\nPlease review the ₹500 quantity discrepancy on the itemised invoice and explain the separate ₹12,000 insurance deduction.\n\nPlease send a written response with the supporting records.\n\nThank you.';

function render({ focus = '', preserveScroll = false } = {}) {
  const before = phone.querySelector('.scroll')?.scrollTop || 0;
  const [content, bottom=''] = screens[state.page]();
  const casePage = ['queue','results','documents','timeline','revision','actions'].includes(state.page);
  const barTitle = casePage ? 'Sample investigation' : names[state.page];
  const bar = state.page==='home'
    ? '<span class="mark" aria-hidden="true">'+symbol('✓')+'</span><span class="name">FairBill</span><button type="button" class="iconbtn avatar" aria-label="Your account" data-action="account">FB</button>'
    : '<button type="button" class="iconbtn" aria-label="Go back" data-action="back">'+symbol('‹')+'</button><span class="name">'+barTitle+'</span>';
  phone.innerHTML = '<header class="appbar">'+bar+'</header><main class="scroll" aria-label="'+names[state.page]+'">'+content+'</main>'+bottom;
  for (const node of index.querySelectorAll('button')) {
    if (node.dataset.jump===state.page) node.setAttribute('aria-current','page');
    else node.removeAttribute('aria-current');
  }
  selector.value = state.page;
  const [title, ...principles] = guide[state.page];
  document.getElementById('notes').innerHTML = '<div class="sequence">Design notes</div><h2>'+title+'</h2><ul>'+
    principles.map(line=>'<li>'+line+'</li>').join('')+'</ul><hr><p>Use the screen index to inspect individual states, or start at Check a bill and follow the sample case.</p>';
  document.title = names[state.page]+' · FairBill prototype';
  if (preserveScroll) phone.querySelector('.scroll').scrollTop = before;
  if (focus) (phone.querySelector(focus)||phone.querySelector('main h1'))?.focus({preventScroll:true});
}

function go(page, from = state.page) {
  if (page!==state.page) state.back.push(from);
  state.page=page;
  state.error=false;
  state.status='';
  state.editing=false;
  render({focus:'main h1'});
}

function returnToPrevious() {
  state.page=state.back.pop()||'home';
  state.error=false;
  state.status='';
  state.editing=false;
  render({focus:'main h1'});
}

function redraw(focus) {
  render({focus,preserveScroll:true});
}

function showCase() {
  state.started=true;
  state.confirmed=true;
  state.investigated=true;
  state.sourceOpen=false;
  go('results');
}

function requestCase(page) {
  if (state.page==='home'&&!state.started&&page==='results') return showCase();
  if (state.page==='home'&&!state.started&&['aid','actions'].includes(page)) return go('cases');
  if (state.page==='home'&&state.started&&!state.investigated&&['results','aid','actions'].includes(page)) return go('queue');
  go(page);
}

function receiptMessage(message, action) {
  state.status=message;
  redraw('[data-action="'+action+'"]');
  document.getElementById('announcer').textContent=message;
}

function showError(field) {
  state.error=true;
  redraw('[data-field="'+field+'"]');
  phone.querySelector('[data-field="'+field+'"]')?.setAttribute('aria-invalid','true');
}

const actions = {
  back: returnToPrevious,
  sample: showCase,
  read: () => go('reading'),
  'read-error': () => {state.error=true;redraw('main h1');},
  'finish-read': () => {
    if (state.error) {state.error=false;redraw('main h1');return;}
    state.started=true;
    state.confirmed=false;
    state.investigated=false;
    state.sourceOpen=false;
    go('confirm');
  },
  'fill-paste': () => {state.paste=sampleLine+'\nTOTAL BILLED | INR 156800';redraw('[data-field="paste"]');},
  'toggle-source': () => {state.sourceOpen=!state.sourceOpen;redraw('[data-action="toggle-source"]');},
  'save-edit': () => {
    const name=phone.querySelector('[data-field="editName"]');
    const units=phone.querySelector('[data-field="editUnits"]');
    if (!name.value.trim()) {name.setCustomValidity('Enter a charge description.');name.reportValidity();return;}
    if (!units.reportValidity()) return;
    state.name=name.value.trim();
    state.units=units.value;
    state.received=!phone.querySelector('[data-field="notReceived"]').checked;
    state.confirmed=false;
    state.investigated=false;
    state.approved=false;
    state.sent=false;
    returnToPrevious();
  },
  'confirm-save': () => {state.started=true;state.confirmed=true;go('queue');},
  check: () => {state.investigated=true;go('results');},
  revise: () => {
    state.revised=true;
    state.approved=false;
    state.sent=false;
    state.call=0;
    state.investigated=false;
    go('queue');
    state.status='The second lab order was added. Run the checks again.';
    redraw('main h1');
  },
  'fill-aid': () => {state.income='250000';state.household='3';state.error=false;redraw('[data-field="income"]');},
  'aid-check': () => {
    if (!/^\d+$/.test((state.income||'').trim())) return showError('income');
    if (!/^(?:[1-9]|[12][0-9]|30)$/.test(state.household||'')) return showError('household');
    go('aidResult');
  },
  'edit-letter': () => {state.editing=true;redraw('[data-field="editLetter"]');},
  'save-letter': () => {
    const field=phone.querySelector('[data-field="editLetter"]');
    const wording=field.value.trim();
    if (!wording) {field.setCustomValidity('Enter the wording to save.');field.reportValidity();return;}
    if (wording!==state.letter) {state.letter=wording;state.approved=false;}
    state.editing=false;
    redraw('main h1');
  },
  approve: () => {state.approved=true;redraw('[data-action="send-letter"]');},
  'send-letter': () => {state.sent=true;redraw('main h1');},
  'call-start': () => {state.call=1;redraw('main h1');},
  'call-verify': () => {state.call=2;redraw('[data-action="call-complete"]');},
  'call-fail': () => {state.call=4;redraw('main h1');},
  'call-complete': () => {state.call=3;redraw('main h1');},
  share: () => receiptMessage('In the mobile app, this opens the device’s share menu. This prototype shares no files.','share'),
  'fill-email': () => {state.email='patient@example.com';state.error=false;redraw('[data-field="email"]');},
  'send-code': () => {
    const input=phone.querySelector('[data-field="email"]');
    if (!state.email.trim()||!input.validity.valid) return showError('email');
    state.code='';
    go('code');
  },
  'fill-code': () => {state.code='236481';state.error=false;redraw('[data-field="code"]');},
  'verify-code': () => {if (state.code!=='236481') return showError('code');state.signedIn=true;go('account');},
  signout: () => {state.signedIn=false;go('login');},
  'delete-confirm': () => {
    if (state.deleteWord!=='DELETE') return showError('deleteWord');
    Object.assign(state,{started:false,confirmed:false,investigated:false,revised:false,signedIn:false,approved:false,
      sent:false,call:0,email:'',code:'',deleteWord:'',letter:letterText,paste:'',name:'Complete blood count',units:'1',received:true});
    go('home');
    document.getElementById('announcer').textContent='Sample session cleared.';
  },
  'fill-address': () => {state.address='http://127.0.0.1:8765';state.error=false;redraw('[data-field="address"]');},
  'test-address': () => {
    if (state.address!=='http://127.0.0.1:8765') return showError('address');
    state.error=false;
    receiptMessage('The sample address is valid. This prototype makes no network request.','test-address');
  },
};

function selectScreen(page) {
  if ((groups[1][1].includes(page)||groups[2][1].includes(page))&&!state.started) {
    state.started=true;
    state.confirmed=page!=='confirm'&&page!=='edit';
    state.investigated=state.confirmed;
  }
  if (page==='source') {state.sourceKey='adjustment';state.sourceFrom='results';}
  go(page);
}
for (const [label,pages] of groups) {
  const section=document.createElement('section');
  section.innerHTML='<h2>'+label+'</h2>'+pages.map(page=>'<button type="button" class="jump" data-jump="'+page+'">'+names[page]+'</button>').join('');
  index.append(section);
  const options=document.createElement('optgroup');
  options.label=label;
  for (const page of pages) options.append(new Option(names[page],page));
  selector.append(options);
}
index.addEventListener('click',event=>{const button=event.target.closest('[data-jump]');if(button)selectScreen(button.dataset.jump);});
selector.addEventListener('change',()=>selectScreen(selector.value));
theme.addEventListener('click',()=>{
  const dark=phone.classList.toggle('dark');
  theme.setAttribute('aria-pressed',String(dark));
  theme.textContent=dark?'Light mode':'Dark mode';
});
phone.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');
  if (!button) return;
  const action=button.dataset.action;
  if (action.startsWith('source-')) {
    state.sourceKey=action.slice(7);
    state.sourceFrom=state.page;
    go('source');
    return;
  }
  if (actions[action]) actions[action]();
  else if (screens[action]) requestCase(action);
});
phone.addEventListener('input',event=>{
  const field=event.target;
  if (!field.dataset.field) return;
  if (typeof field.setCustomValidity==='function') field.setCustomValidity('');
  const name=field.dataset.field;
  if (!['editName','editUnits','notReceived','editLetter'].includes(name)) state[name]=field.value;
  if (name==='paste') phone.querySelector('[data-action="read"]').disabled=!state.paste.trim();
});
render();
</script>
